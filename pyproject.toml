[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slang-3dgs-trainer"
version = "0.0.1"
description = "3D Gaussian Splatting trainer built on SlangPy + slang-rhi"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "slangpy>=0.42.0,<0.43",
    "numpy",
    # Dataset decode path (trainer.data.colmap.load_colmap_image). The HEADLESS
    # build on purpose: we only use imread/cvtColor/resize, so the GUI variant
    # would add Qt/libGL for nothing (and break on headless Linux).
    "opencv-python-headless",
    # Still used for writing PNGs (ground truths, previews).
    "pillow",
    "plyfile",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "setuptools>=61",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
